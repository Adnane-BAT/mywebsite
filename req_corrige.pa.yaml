            - btnSoumettre:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(76, 29, 149, 1)
                  BorderThickness: =1
                  DisplayMode: =If(varEnCours, DisplayMode.Disabled, DisplayMode.Edit)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledFill: =RGBA(167, 139, 250, 1)
                  Fill: =RGBA(76, 29, 149, 1)
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(91, 33, 182, 1)
                  OnSelect: |-
                    =With(
                        {
                            volet: First(PowerBIIntegration.Data).Volet,
                            libelle: Trim(txtLibelle.Text),
                            avancement: IfError(Value(txtAvancement.Text), -1),
                            dejaTraites: Filter(colSelection As s, LookUp(colStatuts As st, st.Contrat = s.Contrat).Statut in ["Soumis", "Validé"])
                        },
                        With(
                            {
                                erreurs: Filter(
                                    Table(
                                        {e: If(IsBlank(volet), "Aucune donnée reçue de Power BI : le volet est introuvable.")},
                                        {e: If(IsBlank(libelle), "Le libellé du plan d'action est obligatoire.")},
                                        {e: If(Len(libelle) > 255, "Le libellé dépasse 255 caractères (" & Len(libelle) & ").")},
                                        {e: If(IsBlank(dpEcheance.SelectedDate), "L'échéance est obligatoire.")},
                                        {e: If(!IsBlank(dpEcheance.SelectedDate) && dpEcheance.SelectedDate < Today(), "L'échéance ne peut pas être antérieure à aujourd'hui.")},
                                        {e: If(IsBlank(Trim(txtAvancement.Text)) || avancement < 0 || avancement > 100, "L'avancement doit être un nombre entre 0 et 100.")},
                                        {e: If(CountRows(colSelection) = 0, "Sélectionne au moins un contrat.")},
                                        {e: If(CountRows(dejaTraites) > 0, CountRows(dejaTraites) & " contrat(s) déjà soumis ou validé(s) : " & Concat(dejaTraites, Contrat, ", "))}
                                    ),
                                    !IsBlank(e)
                                )
                            },
                            If(
                                CountRows(erreurs) > 0,
                                Set(varMsg, {Visible: true, Type: "Erreur", Titre: "Soumission impossible", Message: "Corrige les points suivants avant de soumettre :", Details: Concat(erreurs, "• " & e, Char(10)), Action: ""}),

                                Set(varEnCours, true);
                                Clear(colErreurs);
                                Clear(colOK);

                                // 1. Création du plan d'action
                                Set(
                                    varPlan,
                                    IfError(
                                        Patch(
                                            CP_PlansAction,
                                            Defaults(CP_PlansAction),
                                            {
                                                Titre: libelle,
                                                Volet: {Value: volet},
                                                Echeance: dpEcheance.SelectedDate,
                                                Avancement: avancement,
                                                Commentaire: txtCommentaire.Text,
                                                StatutPlan: {Value: "Soumis"},
                                                NbContrats: CountRows(colSelection),
                                                ContratsConcernes: Concat(colSelection, Contrat, "; ")
                                            }
                                        ),
                                        Blank()
                                    )
                                );

                                If(
                                    IsBlank(varPlan),
                                    Set(varMsg, {Visible: true, Type: "Erreur", Titre: "Échec de la création du plan", Message: "Le plan d'action n'a pas été enregistré. Aucun contrat n'a été modifié.", Details: Coalesce(First(Errors(CP_PlansAction)).Message, "Erreur inconnue : vérifie ta connexion et tes droits sur la liste CP_PlansAction."), Action: ""}),

                                    // 2. Mise à jour de chaque contrat (statut relu côté SharePoint)
                                    ForAll(
                                        colSelection As s,
                                        With(
                                            {c: LookUp(CP_SuiviContrats, Titre = s.Contrat)},
                                            If(
                                                !IsBlank(c) && c.Statut.Value in ["Soumis", "Validé"],
                                                Collect(colErreurs, {Contrat: s.Contrat, Message: "déjà au statut « " & c.Statut.Value & " » (modifié entre-temps par un autre utilisateur)."}),
                                                IfError(
                                                    If(
                                                        IsBlank(c),
                                                        Patch(CP_SuiviContrats, Defaults(CP_SuiviContrats), {Titre: s.Contrat, Volet: {Value: volet}, Statut: {Value: "Soumis"}, DernierPlanID: varPlan.ID}),
                                                        Patch(CP_SuiviContrats, c, {Statut: {Value: "Soumis"}, DernierPlanID: varPlan.ID})
                                                    ),
                                                    Collect(colErreurs, {Contrat: s.Contrat, Message: "statut non mis à jour : " & FirstError.Message}),
                                                    Patch(
                                                        CP_HistoriqueStatuts,
                                                        Defaults(CP_HistoriqueStatuts),
                                                        {
                                                            Titre: s.Contrat,
                                                            AncienStatut: Coalesce(c.Statut.Value, "À traiter"),
                                                            NouveauStatut: "Soumis",
                                                            TypeAction: {Value: "Soumission"},
                                                            PlanActionID: varPlan.ID,
                                                            Commentaire: txtCommentaire.Text
                                                        }
                                                    ),
                                                    Collect(colErreurs, {Contrat: s.Contrat, Message: "soumis, mais l'historique n'a pas été enregistré : " & FirstError.Message});
                                                    Collect(colOK, {Contrat: s.Contrat}),
                                                    Collect(colOK, {Contrat: s.Contrat})
                                                )
                                            )
                                        )
                                    );

                                    // 3. Cohérence du plan : supprimé si aucun contrat, ajusté si partiel
                                    If(
                                        CountRows(colOK) = 0,
                                        IfError(
                                            Remove(CP_PlansAction, varPlan),
                                            Collect(colErreurs, {Contrat: "Plan n°" & varPlan.ID, Message: "plan vide non supprimé, à supprimer manuellement : " & FirstError.Message})
                                        ),
                                        CountRows(colOK) < CountRows(colSelection),
                                        IfError(
                                            Patch(CP_PlansAction, varPlan, {NbContrats: CountRows(colOK), ContratsConcernes: Concat(colOK, Contrat, "; ")}),
                                            Collect(colErreurs, {Contrat: "Plan n°" & varPlan.ID, Message: "liste des contrats du plan non mise à jour : " & FirstError.Message})
                                        )
                                    );

                                    // 4. Rechargement des statuts + Power BI
                                    IfError(
                                        ClearCollect(colStatuts, ForAll(CP_SuiviContrats As r, {Contrat: r.Titre, Statut: r.Statut.Value})),
                                        Collect(colErreurs, {Contrat: "Statuts", Message: "rechargement impossible, l'affichage peut être décalé : " & FirstError.Message})
                                    );
                                    Set(varRefreshOK, true);
                                    If(CountRows(colOK) > 0, IfError(PowerBIIntegration.Refresh(), Set(varRefreshOK, false)));

                                    // 5. Message de résultat
                                    Set(
                                        varMsg,
                                        If(
                                            CountRows(colErreurs) = 0,
                                            {Visible: true, Type: "Succès", Titre: "Plan d'action soumis", Message: CountRows(colOK) & " contrat(s) soumis pour validation." & If(!varRefreshOK, " Le rapport Power BI sera mis à jour au prochain rafraîchissement.", ""), Details: "Plan : " & libelle & Char(10) & "Échéance : " & Text(dpEcheance.SelectedDate, "dd/mm/yyyy") & Char(10) & "Contrats : " & Concat(colOK, Contrat, ", "), Action: ""},
                                            CountRows(colOK) = 0,
                                            {Visible: true, Type: "Erreur", Titre: "Échec de la soumission", Message: "Aucun contrat n'a pu être soumis. Ta saisie est conservée, tu peux réessayer.", Details: Concat(colErreurs, "• " & Contrat & " : " & Message, Char(10)), Action: ""},
                                            {Visible: true, Type: "Avertissement", Titre: "Soumission partielle", Message: CountRows(colOK) & " contrat(s) soumis, " & CountRows(colErreurs) & " point(s) à vérifier. Les contrats non soumis restent sélectionnés.", Details: Concat(colErreurs, "• " & Contrat & " : " & Message, Char(10)), Action: ""}
                                        )
                                    );

                                    // 6. Nettoyage : seuls les contrats traités sortent de la sélection
                                    RemoveIf(colSelection, Contrat in colOK.Contrat);
                                    If(
                                        CountRows(colErreurs) = 0,
                                        Set(varCommentaire, Blank()); Reset(txtLibelle); Reset(dpEcheance); Reset(txtAvancement); Reset(txtCommentaire)
                                    )
                                );
                                Set(varEnCours, false)
                            )
                        )
                    )
                  PressedFill: =RGBA(59, 15, 122, 1)
                  Size: =11
                  Text: ="➤  Soumettre"
                  Width: =170
                  X: =364
                  Y: =724
            - conPopupCommentaire:
