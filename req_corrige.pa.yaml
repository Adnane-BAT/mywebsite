            - galElements:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Fill: =RGBA(255, 255, 255, 0)
                  Height: =246
                  Items: |-
                    =With(
                        {onglet: Coalesce(varOnglet, "À traiter")},
                        Sort(
                            Filter(
                                AddColumns(
                                    PowerBIIntegration.Data,
                                    StatutActuel, Coalesce(LookUp(colStatuts, Contrat = IDCTRTLOCTXT).Statut, Statut),
                                    PrioOrdre, Switch(Priorité, "Haute", 1, "Moyenne", 2, 3)
                                ),
                                Switch(
                                    onglet,
                                    "Tous", true,
                                    "À traiter", !(StatutActuel in ["Soumis", "Validé"]),
                                    StatutActuel = onglet
                                )
                            ),
                            PrioOrdre,
                            SortOrder.Ascending
                        )
                    )
                  TemplateFill: =If(ThisItem.IDCTRTLOCTXT in colSelection.Contrat, RGBA(243, 238, 253, 1), RGBA(255, 255, 255, 0))
