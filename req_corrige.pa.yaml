                        DisplayMode: =If(ThisItem.StatutActuel = "Validé", DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(255, 255, 255, 0)
                        Height: =28
                        OnSelect: |-
                          =If(
                              Self.Value,
                              If(!(ThisItem.IDCTRTLOCTXT in colSelection.Contrat), Collect(colSelection, {Contrat: ThisItem.IDCTRTLOCTXT})),
