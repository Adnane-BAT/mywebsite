                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =42
                              HoverColor: =RGBA(76, 29, 149, 1)
                              HoverFill: =RGBA(243, 238, 253, 1)
                              OnSelect: |-
                                =Set(varMsg, {Visible: false, Type: "", Titre: "", Message: "", Details: "", Action: ""}); Clear(colAValider)
                              PressedFill: =RGBA(233, 223, 252, 1)
                              Size: =11
                              Text: ="Annuler"
                              Visible: =varMsg.Type = "Confirmation"
                              Width: =140
                              X: =160
                              Y: =340
                        - btnMsgConfirmer:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =RGBA(255, 255, 255, 1)
                              DisplayMode: =If(varEnCours, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(76, 29, 149, 1)
                              Font: =Font.'Segoe UI'
                              Height: =42
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(91, 33, 182, 1)
                              OnSelect: |-
                                =With(
                                    {action: varMsg.Action},
                                    Set(varMsg, {Visible: false, Type: "", Titre: "", Message: "", Details: "", Action: ""});
                                    Switch(
                                        action,
                                        "VALIDATION_MASSE",
                                            Set(varEnCours, true);
                                            Clear(colErreurs);
                                            Clear(colOK);
                                            ForAll(
                                                colAValider As s,
                                                With(
                                                    {c: LookUp(CP_SuiviContrats, Titre = s.Contrat)},
                                                    If(
                                                        IsBlank(c),
                                                        Collect(colErreurs, {Contrat: s.Contrat, Message: "introuvable dans la liste CP_SuiviContrats."}),
                                                        c.Statut.Value <> "Soumis",
                                                        Collect(colErreurs, {Contrat: s.Contrat, Message: "statut actuel « " & c.Statut.Value & " » (modifié entre-temps par un autre utilisateur)."}),
                                                        IfError(
                                                            Patch(CP_SuiviContrats, c, {Statut: {Value: "Validé"}, ValideParEmail: User().Email, DateValidation: Now()}),
                                                            Collect(colErreurs, {Contrat: s.Contrat, Message: "statut non mis à jour : " & FirstError.Message}),
                                                            Patch(
                                                                CP_HistoriqueStatuts,
                                                                Defaults(CP_HistoriqueStatuts),
                                                                {
                                                                    Titre: s.Contrat,
                                                                    AncienStatut: "Soumis",
                                                                    NouveauStatut: "Validé",
                                                                    TypeAction: {Value: "Validation de masse"},
                                                                    PlanActionID: c.DernierPlanID,
                                                                    Commentaire: txtCommentaire.Text
                                                                }
                                                            ),
                                                            Collect(colErreurs, {Contrat: s.Contrat, Message: "validé, mais l'historique n'a pas été enregistré : " & FirstError.Message});
                                                            Collect(colOK, {Contrat: s.Contrat}),
                                                            Collect(colOK, {Contrat: s.Contrat})
                                                        )
                                                    )
                                                )
                                            );
                                            IfError(
                                                ClearCollect(colStatuts, ForAll(CP_SuiviContrats As r, {Contrat: r.Titre, Statut: r.Statut.Value})),
                                                Collect(colErreurs, {Contrat: "Statuts", Message: "rechargement impossible, l'affichage peut être décalé : " & FirstError.Message})
                                            );
                                            Set(varRefreshOK, true);
                                            If(CountRows(colOK) > 0, IfError(PowerBIIntegration.Refresh(), Set(varRefreshOK, false)));
                                            Set(
                                                varMsg,
                                                If(
                                                    CountRows(colErreurs) = 0,
                                                    {Visible: true, Type: "Succès", Titre: "Validation effectuée", Message: CountRows(colOK) & " contrat(s) validé(s)." & If(!varRefreshOK, " Le rapport Power BI sera mis à jour au prochain rafraîchissement.", ""), Details: Concat(colOK, "• " & Contrat, Char(10)), Action: ""},
                                                    CountRows(colOK) = 0,
                                                    {Visible: true, Type: "Erreur", Titre: "Échec de la validation", Message: "Aucun contrat n'a pu être validé.", Details: Concat(colErreurs, "• " & Contrat & " : " & Message, Char(10)), Action: ""},
                                                    {Visible: true, Type: "Avertissement", Titre: "Validation partielle", Message: CountRows(colOK) & " contrat(s) validé(s), " & CountRows(colErreurs) & " point(s) à vérifier.", Details: Concat(colErreurs, "• " & Contrat & " : " & Message, Char(10)), Action: ""}
                                                )
                                            );
                                            RemoveIf(colSelection, Contrat in colOK.Contrat);
                                            Set(varEnCours, false)
                                    )
                                )
                              PressedFill: =RGBA(59, 15, 122, 1)
                              Size: =11
                              Text: ="✓  Confirmer"
                              Visible: =varMsg.Type = "Confirmation"
                              Width: =140
                              X: =318
                              Y: =340
            - conTraitementEnCours:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(255, 255, 255, 0)
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 0.7)
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =varEnCours
                  Width: =Parent.Width
                Children:
                  - lblTraitementEnCours:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(76, 29, 149, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        Size: =13
                        Text: ="Traitement en cours…"
                        Width: =Parent.Width
                        Y: =375
