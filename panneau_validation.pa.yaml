    - btnValidationMasse:
        Control: Classic/Button@2.2.0
        Properties:
          Text: ="✓  Validation de masse"
          X: =170
          Y: =732
          Width: =186
          Height: =44
          OnSelect: |-
            =With(
                {aValider: Filter(colSelection As s, LookUp(colStatuts As st, st.Contrat = s.Contrat).Statut = "Soumis")},
                If(
                    CountRows(aValider) = 0,
                    Notify("Aucun contrat au statut « Soumis » dans la sélection.", NotificationType.Warning),
                    ForAll(
                        aValider As s,
                        With(
                            {c: LookUp(CP_SuiviContrats, Contrat = s.Contrat)},
                            Patch(
                                CP_HistoriqueStatuts,
                                Defaults(CP_HistoriqueStatuts),
                                {
                                    Contrat: s.Contrat,
                                    AncienStatut: "Soumis",
                                    NouveauStatut: "Validé",
                                    TypeAction: {Value: "Validation de masse"},
                                    PlanActionID: c.DernierPlanID,
                                    Commentaire: txtCommentaire.Text
                                }
                            );
                            Patch(CP_SuiviContrats, c, {Statut: {Value: "Validé"}, ValideParEmail: User().Email, DateValidation: Now()})
                        )
                    );
                    Notify(
                        CountRows(aValider) & " contrat(s) validé(s)" &
                        If(CountRows(colSelection) > CountRows(aValider), " — " & (CountRows(colSelection) - CountRows(aValider)) & " ignoré(s) (pas au statut Soumis)", ""),
                        NotificationType.Success
                    );
                    ClearCollect(colStatuts, ForAll(CP_SuiviContrats As r, {Contrat: r.Contrat, Statut: r.Statut.Value}));
                    Clear(colSelection);
                    Reset(chkTous);
                    PowerBIIntegration.Refresh()
                )
            )
          Fill: =RGBA(255, 255, 255, 1)
          Color: =RGBA(76, 29, 149, 1)
          BorderColor: =RGBA(201, 184, 242, 1)
          BorderThickness: =1
          HoverFill: =RGBA(243, 238, 253, 1)
          HoverColor: =RGBA(76, 29, 149, 1)
          PressedFill: =RGBA(233, 223, 252, 1)
          RadiusTopLeft: =10
          RadiusTopRight: =10
          RadiusBottomLeft: =10
          RadiusBottomRight: =10
          Size: =11
          FontWeight: =FontWeight.Semibold
          Font: =Font.'Segoe UI'
    - btnSoumettre:
        Control: Classic/Button@2.2.0
        Properties:
          Text: ="➤  Soumettre"
          X: =364
          Y: =732
          Width: =170
          Height: =44
          OnSelect: |-
            =With(
                {volet: First(PowerBIIntegration.Data).Volet},
                If(
                    IsBlank(Trim(txtLibelle.Text)) || IsBlank(dpEcheance.SelectedDate) || CountRows(colSelection) = 0,
                    Notify("Renseigne le libellé, l'échéance et sélectionne au moins un contrat.", NotificationType.Error),
                    Set(
                        varPlan,
                        Patch(
                            CP_PlansAction,
                            Defaults(CP_PlansAction),
                            {
                                Libelle: txtLibelle.Text,
                                Volet: {Value: volet},
                                Echeance: dpEcheance.SelectedDate,
                                Avancement: Value(txtAvancement.Text),
                                Commentaire: txtCommentaire.Text,
                                StatutPlan: {Value: "Soumis"},
                                NbContrats: CountRows(colSelection),
                                ContratsConcernes: Concat(colSelection, Contrat, "; ")
                            }
                        )
                    );
                    ForAll(
                        colSelection As s,
                        With(
                            {c: LookUp(CP_SuiviContrats, Contrat = s.Contrat)},
                            Patch(
                                CP_HistoriqueStatuts,
                                Defaults(CP_HistoriqueStatuts),
                                {
                                    Contrat: s.Contrat,
                                    AncienStatut: Coalesce(c.Statut.Value, "À traiter"),
                                    NouveauStatut: "Soumis",
                                    TypeAction: {Value: "Soumission"},
                                    PlanActionID: varPlan.ID,
                                    Commentaire: txtCommentaire.Text
                                }
                            );
                            If(
                                IsBlank(c),
                                Patch(CP_SuiviContrats, Defaults(CP_SuiviContrats), {Contrat: s.Contrat, Volet: {Value: volet}, Statut: {Value: "Soumis"}, DernierPlanID: varPlan.ID}),
                                Patch(CP_SuiviContrats, c, {Statut: {Value: "Soumis"}, DernierPlanID: varPlan.ID})
                            )
                        )
                    );
                    ClearCollect(colStatuts, ForAll(CP_SuiviContrats As r, {Contrat: r.Contrat, Statut: r.Statut.Value}));
                    Notify("Plan d'action soumis : " & CountRows(colSelection) & " contrat(s).", NotificationType.Success);
                    Clear(colSelection);
                    Reset(txtLibelle); Reset(dpEcheance); Reset(txtAvancement); Reset(txtCommentaire); Reset(chkTous);
                    PowerBIIntegration.Refresh()
                )
            )
          Fill: =RGBA(76, 29, 149, 1)
          Color: =RGBA(255, 255, 255, 1)
          BorderColor: =RGBA(76, 29, 149, 1)
          BorderThickness: =1
          HoverFill: =RGBA(91, 33, 182, 1)
          HoverColor: =RGBA(255, 255, 255, 1)
          PressedFill: =RGBA(59, 15, 122, 1)
          RadiusTopLeft: =10
          RadiusTopRight: =10
          RadiusBottomLeft: =10
          RadiusBottomRight: =10
          Size: =11
          FontWeight: =FontWeight.Semibold
          Font: =Font.'Segoe UI'
